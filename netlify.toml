[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  PYTHON_VERSION = ""

[dev]
  command = "npm run dev"
  port = 4321

[functions]
  node_bundler = "esbuild"

[functions.claude]
  timeout = 60

# Netlify's synchronous function timeout (10s free / 26s paid) is a fixed
# platform ceiling, not configurable here — these entries do nothing on their
# own. The real guard is each function's internal timeoutMs, kept under that
# ceiling so slow calls fail via our own clean JSON error instead of racing
# Netlify's raw 504. See netlify/functions/aeo-run-question.js.

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/figma-proxy"
  to = "/.netlify/functions/figma-proxy"
  status = 200

[[redirects]]
  from = "/api/stack-scan"
  to = "/.netlify/functions/stack-scan"
  status = 200

[[redirects]]
  from = "/api/stack-analyze"
  to = "/.netlify/functions/stack-analyze"
  status = 200

[[redirects]]
  from = "/api/aeo-generate-questions"
  to = "/.netlify/functions/aeo-generate-questions"
  status = 200

[[redirects]]
  from = "/api/aeo-run-question"
  to = "/.netlify/functions/aeo-run-question"
  status = 200

[[redirects]]
  from = "/api/aeo-site-audit"
  to = "/.netlify/functions/aeo-site-audit"
  status = 200

[[redirects]]
  from = "/api/aeo-analyze"
  to = "/.netlify/functions/aeo-analyze"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/webcontainer-builder"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Opener-Policy = "same-origin"